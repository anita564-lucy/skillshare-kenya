{% extends "layout/base.html" %}
{% block content %}
<div class="min-h-screen bg-gray-950 text-white p-6">
  <div class="max-w-2xl mx-auto">
    
    <h1 class="text-3xl font-bold text-green-400 mb-6">Edit Profile</h1>

    <div class="bg-gray-800 rounded-2xl p-6">
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="space-y-4">
          {% for field in form %}
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-400 text-sm mt-1">{{ field.errors.0 }}</p>
            {% endif %}
          </div>
          {% endfor %}
        </div>

        <div class="flex gap-3 mt-6">
          <button type="submit" class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded-lg font-medium">
            Save Changes
          </button>
          <a href="{% url 'users:profile' %}" class="bg-gray-700 hover:bg-gray-600 px-6 py-2 rounded-lg">Cancel</a>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
