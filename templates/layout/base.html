{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillShare Kenya</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-950 text-white">

    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-green-400 font-bold text-xl">🇰🇪 SkillShare Kenya</a>
        <div class="flex gap-4 items-center">
            <a href="{% url 'skills:skills_list' %}" class="text-gray-300 hover:text-green-400">Browse Skills</a>
            {% if request.user.is_authenticated %}
            <a href="{% url 'users:profile' %}" class="text-gray-300 hover:text-green-400">Profile</a>
            <a href="{% url 'skills:skill_create' %}" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg text-sm">+ List Skill</a>
            <a href="{% url 'account_logout' %}" class="text-gray-400 hover:text-red-400 text-sm">Logout</a>
            {% else %}
            <a href="{% url 'account_login' %}" class="text-gray-300 hover:text-green-400">Login</a>
            <a href="{% url 'account_signup' %}" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg text-sm">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <!-- Messages -->
    {% if messages %}
    <div class="p-4">
        {% for message in messages %}
        <div class="bg-green-800 text-green-200 px-4 py-2 rounded-lg mb-2">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Content -->
    {% block content %}{% endblock %}

</body>
</html>
