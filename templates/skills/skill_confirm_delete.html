{% extends "layout/base.html" %}
{% block content %}
<div class="min-h-screen bg-gray-950 text-white p-6">
  <div class="max-w-md mx-auto">
    
    <div class="bg-gray-800 rounded-2xl p-6 text-center">
      <p class="text-5xl mb-4">⚠️</p>
      <h1 class="text-2xl font-bold text-red-400 mb-2">Delete Skill</h1>
      <p class="text-gray-400 mb-6">Are you sure you want to delete <strong>{{ skill.title }}</strong>? This cannot be undone.</p>

      <form method="POST">
        {% csrf_token %}
        <div class="flex gap-3 justify-center">
          <button type="submit" class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-lg">Yes, Delete</button>
          <a href="{% url 'skills:skills_list' %}" class="bg-gray-700 hover:bg-gray-600 px-6 py-2 rounded-lg">Cancel</a>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
